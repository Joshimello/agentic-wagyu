<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 800" width="1336" height="800" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Chronicler: current architecture and pipeline</title>
  <desc id="architecture-desc">People reach the web app through the lab HTTPS proxy and Tailscale; a worker, a translator and a GPU media service share PostgreSQL and an evidence volume and call an external LLM; files move from upload through interpretation, project memory, comparison and human review into reviewed memory that the Researcher answers from.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      .title { font: 400 30px 'Instrument Serif', Georgia, serif; fill: #2d3142; }
      .call { font: italic 400 15px 'Instrument Serif', Georgia, serif; fill: #4f5d75; }
      .eyebrow { font: 500 9px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 0.18em; fill: #4f5d75; }
      .zone { font: 500 8px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 0.16em; fill: #7a8399; }
      .name { font: 600 12px 'Geist', 'Segoe UI', system-ui, sans-serif; fill: #2d3142; text-anchor: middle; }
      .sub { font: 400 9px 'Geist Mono', ui-monospace, Consolas, monospace; fill: #4f5d75; text-anchor: middle; }
      .tag { font: 400 7px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 0.08em; fill: #4f5d75; text-anchor: middle; }
      .tagbox { fill: none; stroke: rgba(45,49,66,0.4); stroke-width: 0.8; }
      .lab { font: 400 8px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 0.06em; fill: #7a8399; text-anchor: middle; }
      .leg { font: 400 9px 'Geist Mono', ui-monospace, Consolas, monospace; fill: #4f5d75; }
      .mask { fill: #f5f5f5; }
      .a { fill: none; stroke: #4f5d75; stroke-width: 1; marker-end: url(#arrow); }
      .l { fill: none; stroke: #2e5aa8; stroke-width: 1; marker-end: url(#arrow-link); }
      .d { fill: none; stroke: #4f5d75; stroke-width: 1; stroke-dasharray: 5,4; marker-end: url(#arrow); }
      .backend { fill: #ffffff; stroke: #2d3142; }
      .store { fill: rgba(45,49,66,0.05); stroke: #4f5d75; }
      .external { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.3); }
      .input { fill: rgba(79,93,117,0.1); stroke: #7a8399; }
      .focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="1336" height="800" fill="#f5f5f5"/>
  <text class="title" x="40" y="56">Chronicler: current architecture</text>

  <!-- ============ RUNTIME ============ -->
  <text class="eyebrow" x="40" y="96">RUNTIME · WHAT RUNS WHERE</text>
  <rect x="440" y="112" width="648" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)"/>
  <text class="zone" x="456" y="134">PODMAN · CHRONICLER_FINALS · 6 CONTAINERS + 1 VOLUME</text>

  <!-- connectors -->
  <line class="a" x1="192" y1="184" x2="240" y2="184"/>
  <line class="a" x1="392" y1="184" x2="464" y2="184"/>
  <line class="a" x1="608" y1="184" x2="672" y2="184"/>
  <path class="a" d="M728,216 V228 Q728,236 720,236 H668 Q660,236 660,244 V272"/>
  <path class="a" d="M784,216 V228 Q784,236 792,236 H868 Q876,236 876,244 V272"/>
  <path class="a" d="M536,392 V380 Q536,372 544,372 H624 Q632,372 632,364 V336"/>
  <path class="a" d="M728,392 V380 Q728,372 720,372 H696 Q688,372 688,364 V336"/>
  <path class="a" d="M784,392 V380 Q784,372 792,372 H840 Q848,372 848,364 V336"/>
  <path class="a" d="M980,392 V380 Q980,372 972,372 H912 Q904,372 904,364 V336"/>
  <line class="a" x1="840" y1="424" x2="896" y2="424"/>
  <path class="l" d="M756,456 V484 Q756,492 764,492 H1176 Q1184,492 1184,484 V456"/>
  <path class="l" d="M536,456 V500 Q536,508 544,508 H1232 Q1240,508 1240,500 V456"/>

  <!-- connector labels -->
  <rect class="mask" x="198" y="164" width="36" height="12" rx="2"/><text class="lab" x="216" y="173">HTTPS</text>
  <rect class="mask" x="626" y="164" width="28" height="12" rx="2"/><text class="lab" x="640" y="173">HTTP</text>
  <rect class="mask" x="854" y="404" width="28" height="12" rx="2"/><text class="lab" x="868" y="413">HTTP</text>
  <rect class="mask" x="932" y="516" width="56" height="12" rx="2"/><text class="lab" x="960" y="525">LLM CALLS</text>

  <!-- Browser -->
  <rect class="mask" x="40" y="152" width="152" height="64" rx="6"/><rect class="input" x="40" y="152" width="152" height="64" rx="6"/>
  <rect class="tagbox" x="48" y="158" width="28" height="12" rx="2"/><text class="tag" x="62" y="167">USER</text>
  <text class="name" x="116" y="190">Browser</text><text class="sub" x="116" y="204">Leader · Student</text>

  <!-- Proxy -->
  <rect class="mask" x="240" y="152" width="152" height="64" rx="6"/><rect class="external" x="240" y="152" width="152" height="64" rx="6"/>
  <rect class="tagbox" x="248" y="158" width="28" height="12" rx="2"/><text class="tag" x="262" y="167">EDGE</text>
  <text class="name" x="316" y="190">Lab HTTPS proxy</text><text class="sub" x="316" y="204">public address · TLS</text>

  <!-- Tailscale -->
  <rect class="mask" x="464" y="152" width="144" height="64" rx="6"/><rect class="backend" x="464" y="152" width="144" height="64" rx="6"/>
  <rect class="tagbox" x="472" y="158" width="24" height="12" rx="2"/><text class="tag" x="484" y="167">NET</text>
  <text class="name" x="536" y="190">Tailscale</text><text class="sub" x="536" y="204">userspace · to web:5173</text>

  <!-- Web (focal) -->
  <rect class="mask" x="672" y="152" width="168" height="64" rx="6"/><rect class="focal" x="672" y="152" width="168" height="64" rx="6"/>
  <rect x="680" y="158" width="24" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/><text class="tag" x="692" y="167" style="fill:#eb6c36">WEB</text>
  <text class="name" x="756" y="190">Web app</text><text class="sub" x="756" y="204">SvelteKit · Bun · pages + API</text>

  <!-- Database -->
  <rect class="mask" x="576" y="272" width="168" height="64" rx="6"/><rect class="store" x="576" y="272" width="168" height="64" rx="6"/>
  <rect class="tagbox" x="584" y="278" width="20" height="12" rx="2"/><text class="tag" x="594" y="287">DB</text>
  <text class="name" x="660" y="310">PostgreSQL</text><text class="sub" x="660" y="324">records · pg-boss job queue</text>

  <!-- Evidence -->
  <rect class="mask" x="792" y="272" width="168" height="64" rx="6"/><rect class="store" x="792" y="272" width="168" height="64" rx="6"/>
  <rect class="tagbox" x="800" y="278" width="32" height="12" rx="2"/><text class="tag" x="816" y="287">FILES</text>
  <text class="name" x="876" y="310">Evidence files</text><text class="sub" x="876" y="324">/data · originals, renders</text>

  <!-- Translator -->
  <rect class="mask" x="464" y="392" width="144" height="64" rx="6"/><rect class="backend" x="464" y="392" width="144" height="64" rx="6"/>
  <rect class="tagbox" x="472" y="398" width="28" height="12" rx="2"/><text class="tag" x="486" y="407">JOBS</text>
  <text class="name" x="536" y="430">Translator</text><text class="sub" x="536" y="444">Bun · reading copies</text>

  <!-- Worker -->
  <rect class="mask" x="672" y="392" width="168" height="64" rx="6"/><rect class="backend" x="672" y="392" width="168" height="64" rx="6"/>
  <rect class="tagbox" x="680" y="398" width="28" height="12" rx="2"/><text class="tag" x="694" y="407">JOBS</text>
  <text class="name" x="756" y="430">Worker</text><text class="sub" x="756" y="444">Bun · runs the 4 agents</text>

  <!-- Media -->
  <rect class="mask" x="896" y="392" width="168" height="64" rx="6"/><rect class="backend" x="896" y="392" width="168" height="64" rx="6"/>
  <rect class="tagbox" x="904" y="398" width="24" height="12" rx="2"/><text class="tag" x="916" y="407">GPU</text>
  <text class="name" x="980" y="430">Media service</text><text class="sub" x="980" y="444">Python · MOSS ASR · ffmpeg</text>

  <!-- LLM -->
  <rect class="mask" x="1128" y="392" width="168" height="64" rx="6"/><rect class="external" x="1128" y="392" width="168" height="64" rx="6"/>
  <rect class="tagbox" x="1136" y="398" width="36" height="12" rx="2"/><text class="tag" x="1154" y="407">CLOUD</text>
  <text class="name" x="1212" y="430">LLM API</text><text class="sub" x="1212" y="444">OpenAI-compatible · Qwen</text>

  <text class="call" x="40" y="300">Only the web app is reachable from outside.</text>
  <text class="call" x="40" y="322">Agents run in the worker, never in the browser.</text>

  <!-- ============ PIPELINE ============ -->
  <text class="eyebrow" x="40" y="576">PIPELINE · FROM A FILE TO REVIEWED MEMORY</text>
  <text class="call" x="1296" y="576" text-anchor="end">Nothing becomes memory until a person accepts it.</text>

  <!-- connectors -->
  <line class="a" x1="176" y1="632" x2="200" y2="632"/>
  <line class="a" x1="336" y1="632" x2="360" y2="632"/>
  <line class="a" x1="496" y1="632" x2="520" y2="632"/>
  <line class="a" x1="656" y1="632" x2="680" y2="632"/>
  <line class="a" x1="816" y1="632" x2="840" y2="632"/>
  <line class="a" x1="976" y1="632" x2="1000" y2="632"/>
  <line class="a" x1="1136" y1="632" x2="1160" y2="632"/>
  <path class="d" d="M588,668 V692 Q588,700 596,700 H1220 Q1228,700 1228,692 V668"/>
  <rect class="mask" x="868" y="708" width="80" height="12" rx="2"/><text class="lab" x="908" y="717">ALSO SEARCHED</text>

  <!-- 1 Upload -->
  <rect class="mask" x="40" y="596" width="136" height="72" rx="6"/><rect class="input" x="40" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="48" y="602" width="38" height="12" rx="2"/><text class="tag" x="67" y="611">PERSON</text>
  <text class="name" x="108" y="640">1 · Upload</text><text class="sub" x="108" y="655">video · slides · PDF</text>

  <!-- 2 Interpret -->
  <rect class="mask" x="200" y="596" width="136" height="72" rx="6"/><rect class="backend" x="200" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="208" y="602" width="62" height="12" rx="2"/><text class="tag" x="239" y="611">INTERPRETER</text>
  <text class="name" x="268" y="640">2 · Interpret</text><text class="sub" x="268" y="655">transcript + frames</text>

  <!-- 3 Check -->
  <rect class="mask" x="360" y="596" width="136" height="72" rx="6"/><rect class="input" x="360" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="368" y="602" width="38" height="12" rx="2"/><text class="tag" x="387" y="611">PERSON</text>
  <text class="name" x="428" y="640">3 · Check</text><text class="sub" x="428" y="655">fix text, speakers</text>

  <!-- 4 Add to project -->
  <rect class="mask" x="520" y="596" width="136" height="72" rx="6"/><rect class="backend" x="520" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="528" y="602" width="58" height="12" rx="2"/><text class="tag" x="557" y="611">CHRONICLER</text>
  <text class="name" x="588" y="640">4 · Add to project</text><text class="sub" x="588" y="655">summaries, topics</text>

  <!-- 5 Compare -->
  <rect class="mask" x="680" y="596" width="136" height="72" rx="6"/><rect class="backend" x="680" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="688" y="602" width="42" height="12" rx="2"/><text class="tag" x="709" y="611">CHANGES</text>
  <text class="name" x="748" y="640">5 · Compare</text><text class="sub" x="748" y="655">two meetings</text>

  <!-- 6 Review -->
  <rect class="mask" x="840" y="596" width="136" height="72" rx="6"/><rect class="input" x="840" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="848" y="602" width="38" height="12" rx="2"/><text class="tag" x="867" y="611">LEADER</text>
  <text class="name" x="908" y="640">6 · Review</text><text class="sub" x="908" y="655">accept · edit · reject</text>

  <!-- 7 Memory (focal) -->
  <rect class="mask" x="1000" y="596" width="136" height="72" rx="6"/><rect class="focal" x="1000" y="596" width="136" height="72" rx="6"/>
  <rect x="1008" y="602" width="34" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/><text class="tag" x="1025" y="611" style="fill:#eb6c36">STORE</text>
  <text class="name" x="1068" y="640">7 · Reviewed memory</text><text class="sub" x="1068" y="655">decisions + tasks</text>

  <!-- 8 Ask -->
  <rect class="mask" x="1160" y="596" width="136" height="72" rx="6"/><rect class="backend" x="1160" y="596" width="136" height="72" rx="6"/>
  <rect class="tagbox" x="1168" y="602" width="58" height="12" rx="2"/><text class="tag" x="1197" y="611">RESEARCHER</text>
  <text class="name" x="1228" y="640">8 · Ask</text><text class="sub" x="1228" y="655">cited answers</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="752" x2="1296" y2="752" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text class="eyebrow" x="40" y="776">LEGEND</text>
  <rect class="focal" x="128" y="766" width="16" height="12" rx="2"/><text class="leg" x="152" y="776">Focal</text>
  <rect class="backend" x="224" y="766" width="16" height="12" rx="2"/><text class="leg" x="248" y="776">Service or agent</text>
  <rect class="input" x="384" y="766" width="16" height="12" rx="2"/><text class="leg" x="408" y="776">Person</text>
  <rect class="store" x="488" y="766" width="16" height="12" rx="2"/><text class="leg" x="512" y="776">Storage</text>
  <rect class="external" x="592" y="766" width="16" height="12" rx="2"/><text class="leg" x="616" y="776">Outside the stack</text>
  <line class="a" x1="760" y1="772" x2="792" y2="772"/><text class="leg" x="800" y="776">Internal call</text>
  <line class="l" x1="912" y1="772" x2="944" y2="772"/><text class="leg" x="952" y="776">LLM call</text>
  <line class="d" x1="1040" y1="772" x2="1072" y2="772"/><text class="leg" x="1080" y="776">Also reads</text>
</svg>
