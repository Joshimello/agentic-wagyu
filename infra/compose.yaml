name: chronicler
services:
  database:
    image: docker.io/pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: chronicler
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: chronicler
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicler -d chronicler"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  media:
    image: localhost/chronicler-media:dev
    build: {context: .., dockerfile: infra/media.Containerfile}
    devices: ["${NVIDIA_CDI_DEVICE:-nvidia.com/gpu=0}"]
    volumes: ["../data:/data", "../data/cache:/cache"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/health',timeout=3))['ok']"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  web:
    image: localhost/chronicler-web:dev
    build: {context: .., dockerfile: infra/web.Containerfile, target: development, args: {APP_ORIGIN: "${CHRONICLER_ORIGIN:-http://localhost:5173}"}}
    command: ["sh", "-c", "bun run --cwd apps/web db:migrate && exec bun apps/web/build"]
    environment:
      DATABASE_URL: postgres://chronicler:local-only@database:5432/chronicler
      DATA_ROOT: /data
      MEDIA_URL: http://media:8000
      HOST: 0.0.0.0
      PORT: 5173
      BODY_SIZE_LIMIT: 536870912
    ports: ["127.0.0.1:5173:5173"]
    volumes: ["../data:/data"]
    depends_on: {database: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker:
    image: localhost/chronicler-web:dev
    stop_grace_period: 45s
    command: ["bun", "apps/web/workers/run.ts"]
    env_file: ["../.env"]
    environment:
      DATABASE_URL: postgres://chronicler:local-only@database:5432/chronicler
      DATA_ROOT: /data
      MEDIA_URL: http://media:8000
    volumes: ["../data:/data"]
    depends_on: {web: {condition: service_healthy}, media: {condition: service_healthy}}
    restart: unless-stopped
  translator:
    image: localhost/chronicler-web:dev
    stop_grace_period: 45s
    command: ["bun", "apps/web/workers/translate.ts"]
    env_file: ["../.env"]
    environment:
      DATABASE_URL: postgres://chronicler:local-only@database:5432/chronicler
      DATA_ROOT: /data
    volumes: ["../data:/data"]
    depends_on: {web: {condition: service_healthy}}
    restart: unless-stopped
volumes:
  database:
